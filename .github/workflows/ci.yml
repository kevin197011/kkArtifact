name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [server, agent]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go build ./...
      - run: go test ./...

  web-ui:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - run: npm run build

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [test, web-ui]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: agent/go.sum

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Build and start stack
        run: docker compose up -d --build --wait

      - name: Build agent CLI
        run: go build -o /tmp/kkartifact-agent .
        working-directory: agent

      - name: Run integration tests
        run: ruby scripts/test_integration.rb
        env:
          KK_SERVER_URL: http://localhost:8080
          KK_AGENT_BIN: /tmp/kkartifact-agent
          NO_INTERACTION: true
