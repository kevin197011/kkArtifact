name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR 包名统一小写，与 docker-compose.prod.yml 一致
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/kkartifact

jobs:
  build-images:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: server
            context: .
            dockerfile: ./server/Dockerfile
            image: server
          - component: web-ui
            context: ./web-ui
            dockerfile: ./web-ui/Dockerfile
            image: web-ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  release:
    name: Create GitHub Release
    needs: build-images
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Docker 镜像

            | 组件 | 镜像 |
            |------|------|
            | Server（含 Agent 二进制） | `${{ env.IMAGE_PREFIX }}/server:${{ github.ref_name }}` |
            | Web UI | `${{ env.IMAGE_PREFIX }}/web-ui:${{ github.ref_name }}` |

            ## 生产部署

            ```bash
            # 拉取镜像
            docker pull ${{ env.IMAGE_PREFIX }}/server:${{ github.ref_name }}
            docker pull ${{ env.IMAGE_PREFIX }}/web-ui:${{ github.ref_name }}

            # 使用 docker-compose.prod.yml 启动
            KK_SERVER_IMAGE=${{ env.IMAGE_PREFIX }}/server:${{ github.ref_name }} \
            KK_WEB_UI_IMAGE=${{ env.IMAGE_PREFIX }}/web-ui:${{ github.ref_name }} \
            docker compose -f docker-compose.prod.yml up -d
            ```

            ## 安装 Agent

            Agent 已打包在 Server 镜像内，也可通过安装脚本下载：

            ```bash
            curl -fsSL https://your-server/api/v1/downloads/scripts/install-agent.sh | bash
            ```
